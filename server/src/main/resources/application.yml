spring:
  application:
    name: authsync

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never

authsync:
  google-web-client-id: ${GOOGLE_WEB_CLIENT_ID:}
  google-extension-client-id: ${GOOGLE_EXTENSION_CLIENT_ID:}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:8080}
  firebase-project-id: ${FIREBASE_PROJECT_ID:}
  firebase-credentials-path: ${GOOGLE_APPLICATION_CREDENTIALS:}

