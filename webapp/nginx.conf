server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cloud Run terminates TLS before forwarding traffic to this container.
    # Keep redirects relative so Nginx does not expose its internal HTTP :8080 endpoint.
    absolute_redirect off;

    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Lockstep is published only below /lockstep/.
    location = /lockstep {
        return 308 /lockstep/;
    }

    location = /lockstep/sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /sw.js =404;
    }

    location = /lockstep/config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /config.js =404;
    }

    location /lockstep/ {
        rewrite ^/lockstep(/.*)$ $1 break;
        try_files $uri /lockstep/index.html;
    }

    # The domain root and every other path intentionally return no content.
    location / {
        return 204;
    }
}
