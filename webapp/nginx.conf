# Third-party QR libraries and icons never change between releases, so browsers may keep them for a week.
# Everything else is revalidated on each visit (a cheap 304 when unchanged). "expires" is used instead of
# add_header so the security headers declared in the server block below are still inherited.
map $uri $lockstep_expires {
    default                              epoch;
    ~^(/lockstep)?/(vendor|icons)/       7d;
}

server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cloud Run terminates TLS before forwarding traffic to this container.
    # Keep redirects relative so Nginx does not expose its internal HTTP :8080 endpoint.
    absolute_redirect off;

    # Google injects a separate button stylesheet, even when /gsi/style is loaded. Permit its exact bytes
    # by hash below; do not allow arbitrary inline CSS. Recheck this hash when Google's library changes.
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Only this app, its API, and Google's sign-in may run scripts, load frames or be contacted. The two
    # sha256 values allow the small inline scripts in index.html and privacy.html; if either script
    # changes, recompute its hash. Styles come only from stylesheets (no inline styles). ${LOCKSTEP_API_BASE_URL} is filled in when the container starts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-yLtySBGrbFP+zsOIJjtRynJeo4M0W8BOZsd+msHVU+0=' 'sha256-9G+ZEjK4FvicPqy823ES862ixLp1UvIjPXLNCCAhtQM=' https://accounts.google.com/gsi/client; style-src 'self' https://accounts.google.com/gsi/style 'sha256-RU4sU0AaS8IBGZx8XrGt/pa9A5SLA3dQszGeqT5L3Kw='; connect-src 'self' ${LOCKSTEP_API_BASE_URL} https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; report-uri ${LOCKSTEP_API_BASE_URL}/api/v1/csp-report" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Trusted Types in report-only mode: Lockstep's own code builds no HTML from text, and violations (for
    # example from Google's sign-in script) only appear in the browser console. After checking the console on
    # the live site, the directive can move into the enforced policy above.
    # Both policies send their reports to the API's /api/v1/csp-report, which logs them (Cloud Logging).
    add_header Content-Security-Policy-Report-Only "require-trusted-types-for 'script'; report-uri ${LOCKSTEP_API_BASE_URL}/api/v1/csp-report" always;
    # This site's files may only be loaded by this site (no embedding of its scripts or images elsewhere).
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # Only the browser features Lockstep uses (camera and screen sharing for QR scanning, idle detection for
    # "lock when the screen locks") are allowed; everything else is switched off for this site.
    add_header Permissions-Policy "camera=(self), display-capture=(self), idle-detection=(self), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), hid=(), midi=(), accelerometer=(), gyroscope=(), magnetometer=(), browsing-topics=()" always;

    # Compress text responses (JavaScript, CSS, HTML, JSON); they shrink to roughly a quarter of their size.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript text/javascript application/json application/manifest+json image/svg+xml;

    # Lockstep is published only below /lockstep/.
    location = /lockstep {
        return 308 /lockstep/;
    }

    # "expires epoch" (Cache-Control: no-cache) instead of add_header: a location with its own add_header
    # would drop every security header declared above.
    location = /lockstep/sw.js {
        expires epoch;
        try_files /sw.js =404;
    }

    location = /lockstep/config.js {
        expires epoch;
        try_files /config.js =404;
    }

    # Optional same-origin API proxy (/lockstep/api/), written by the entrypoint when
    # LOCKSTEP_USE_API_PROXY=true; otherwise this include is empty.
    include /etc/nginx/lockstep/*.conf;

    location /lockstep/ {
        expires $lockstep_expires;
        rewrite ^/lockstep(/.*)$ $1 break;
        # The app has no client-side routes: serve index.html for /lockstep/ only, and 404 for missing
        # files (never index.html), so a missing script can't be cached as a page.
        try_files $uri $uri/index.html =404;
    }

    # A 404 response commits a blank navigation. Do not use 204 here: browsers
    # retain the previously displayed /lockstep/ document for 204 navigations.
    location = / {
        default_type text/html;
        return 404 "<!doctype html><title></title>";
    }

    # Paths outside /lockstep/ render a blank not-found page.
    location / {
        default_type text/html;
        return 404 "<!doctype html><title></title>";
    }
}
